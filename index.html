<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Pickleball 3D</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Menu / Game-over overlay -->
  <div id="overlay">
    <!-- Menu screen -->
    <div id="menu-screen" class="screen">
      <h1 class="game-title">PICKLEBALL</h1>
      <p class="game-sub">3D Championship</p>

      <p class="section-label">Choose Your Character</p>
      <div id="char-grid">
        <div class="char-card selected" data-idx="0">
          <div class="char-avatar" style="background:#2980B9">A</div>
          <div class="char-name">Alex</div>
          <div class="char-tag">Balanced</div>
        </div>
        <div class="char-card" data-idx="1">
          <div class="char-avatar" style="background:#E67E22">J</div>
          <div class="char-name">Jordan</div>
          <div class="char-tag">Power</div>
        </div>
        <div class="char-card" data-idx="2">
          <div class="char-avatar" style="background:#27AE60">R</div>
          <div class="char-name">River</div>
          <div class="char-tag">Agile</div>
        </div>
        <div class="char-card" data-idx="3">
          <div class="char-avatar" style="background:#8E44AD">T</div>
          <div class="char-name">Taylor</div>
          <div class="char-tag">Pro</div>
        </div>
      </div>

      <p class="section-label">Difficulty</p>
      <div id="diff-row">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="medium">Medium</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>

      <button id="play-btn">PLAY</button>
    </div>

    <!-- Game-over screen -->
    <div id="over-screen" class="screen" style="display:none">
      <div id="over-result"></div>
      <div id="over-score"></div>
      <button id="replay-btn">PLAY AGAIN</button>
      <button id="menu-btn">MENU</button>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="hud" style="display:none">
    <div id="hud-left"><span class="hud-label" id="hud-p-name">YOU</span><span class="hud-score" id="hud-p-score">0</span></div>
    <div id="hud-center"><span id="hud-serve-txt">YOUR SERVE</span></div>
    <div id="hud-right"><span class="hud-score" id="hud-a-score">0</span><span class="hud-label">AI</span></div>
  </div>

  <!-- Floating message (point result) -->
  <div id="float-msg" style="display:none"></div>

  <!-- Two-bounce hint -->
  <div id="bounce-hint" style="display:none">LET IT BOUNCE!</div>

  <!-- Touch controls (auto-shown on touch devices) -->
  <div id="touch-ctrl" style="display:none">
    <div id="stick-zone"></div>
    <div id="stick-base"><div id="stick-nub"></div></div>
    <button id="hit-btn">HIT</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
